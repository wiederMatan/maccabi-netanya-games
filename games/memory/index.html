<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מכבי נתניה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>משחק זיכרון - מכבי נתניה</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .memory-grid {
      display: grid;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto 16px;
    }
    .card {
      aspect-ratio: 0.75;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card.matched { cursor: default; }
    /* Dim the faces, not the card: opacity on the card itself would flatten its
       3D context and show the back face through. */
    .card.matched .card-face { opacity: 0.55; }
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }
    .card-back {
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      border: 3px solid #b38f00;
      font-size: 2em;
    }
    .card-front {
      background: linear-gradient(135deg, #001a3d, #003087);
      border: 3px solid #4a8ccc;
      transform: rotateY(180deg);
      padding: 5px;
    }
    .card-front img {
      width: 100%;
      height: 72%;
      object-fit: cover;
      border-radius: 6px;
    }
    .card-front .pup-name {
      font-size: 0.68em;
      font-weight: bold;
      color: #ffe08a;
      margin-top: 3px;
      text-align: center;
      line-height: 1.15;
    }
    .card-back { font-size: clamp(1.1em, 6vw, 2em); }
    .card.shake { animation: shake 0.35s; }
    @keyframes shake {
      25% { translate: -4px 0; }
      75% { translate: 4px 0; }
    }
    /* Phone on its side: drop the title and tighten the header so the board
       gets the height. */
    @media (max-height: 500px) and (orientation: landscape) {
      body.playing .game-title-bar { display: none; }
      body.playing .game-container { padding-bottom: max(4px, env(safe-area-inset-bottom)); }
      body.playing .back-btn { position: absolute; margin: 0; min-height: 38px;
        top: max(8px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
      body.playing .score-bar { margin: 2px 0 8px; padding: 0 130px 0 0; justify-content: flex-start; }
      body.playing .score-item { padding: 6px 12px; }
      body.playing .btn { min-height: 40px; padding: 8px 18px; margin: 4px; }
    }
    @media (max-width: 520px) {
      .card, .card-face { border-radius: 9px; }
      .card-back, .card-front { border-width: 2px; }
      .card-front { padding: 3px; }
      .card-front .pup-name { font-size: 0.6em; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <a href="../../index.html" class="back-btn">← חזור לפורטל</a>
    <div class="game-title-bar">🃏 משחק זיכרון</div>

    <div class="level-select" id="level-select">
      <button class="level-btn" onclick="startGame('easy')">
        <div class="level-icon">⭐</div>
        <div class="level-name">קל</div>
        <div class="level-desc">6 זוגות</div>
      </button>
      <button class="level-btn" onclick="startGame('medium')">
        <div class="level-icon">⭐⭐</div>
        <div class="level-name">בינוני</div>
        <div class="level-desc">9 זוגות</div>
      </button>
      <button class="level-btn" onclick="startGame('hard')">
        <div class="level-icon">⭐⭐⭐</div>
        <div class="level-name">קשה</div>
        <div class="level-desc">12 זוגות</div>
      </button>
      <button class="level-btn" onclick="startGame('expert')">
        <div class="level-icon">⭐⭐⭐⭐</div>
        <div class="level-name">מומחה</div>
        <div class="level-desc">16 זוגות</div>
      </button>
    </div>

    <div id="game-area" style="display:none;">
      <div class="score-bar">
        <div class="score-item">רמה: <strong id="level-label"></strong></div>
        <div class="score-item">ניסיונות: <strong id="attempts">0</strong></div>
        <div class="score-item">זוגות: <strong id="matched">0</strong> / <span id="total-pairs">0</span></div>
      </div>
      <div class="memory-grid" id="grid"></div>
      <div class="win-message" id="win-msg" role="dialog" aria-modal="true">
        <div class="win-sheet">
          🎉 כל הכבוד! מצאת את כל הזוגות!<br>⭐ קיבלת כוכב!<br><br>
          <button class="btn btn-primary" onclick="startGame(currentLevel)">שחק שוב</button>
          <button class="btn btn-secondary" onclick="showLevelSelect()">בחר רמה אחרת</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="startGame(currentLevel)">התחל מחדש</button>
      <button class="btn btn-secondary" onclick="showLevelSelect()">בחר רמה אחרת</button>
    </div>
  </div>
  <script src="../../app.js"></script>
  <script>
    // Maccabi Netanya squad
    const roster = [
      { id: 'samu',       img: '../../images/players/22-samu.webp',        name: 'סמואל דה סילבה', num: 22 },
      { id: 'antman',     img: '../../images/players/1-antma.webp',        name: 'ניב אנטמן',      num: 1 },
      { id: 'dcohen',     img: '../../images/players/daniel-cohen.webp',   name: 'דניאל כהן',      num: 75 },
      { id: 'morozov',    img: '../../images/players/2-morozov.webp',      name: 'גרגורי מורוזוב',  num: 2 },
      { id: 'azugi',      img: '../../images/players/12-azugi.webp',       name: 'אלון עזוגי',      num: 12 },
      { id: 'konate',     img: '../../images/players/6-konate.webp',       name: 'בקארי קונטה',     num: 6 },
      { id: 'feldman',    img: '../../images/players/44-feldman.webp',     name: 'בני פלדמן',       num: 44 },
      { id: 'saba',       img: '../../images/players/40-saba.webp',        name: 'סבא חובדז\'יאני',  num: 40 },
      { id: 'benshabat',  img: '../../images/players/4-ben-shabat.webp',   name: 'איתי בן שבת',     num: 4 },
      { id: 'kolikov',    img: '../../images/players/5-kolikov.webp',      name: 'דניס קוליקוב',    num: 5 },
      { id: 'jabber',     img: '../../images/players/26-jabber.webp',      name: 'כראם ג\'אבר',      num: 26 },
      { id: 'amitcohen',  img: '../../images/players/24-amit-cohen.webp',  name: 'עמית כהן',        num: 24 },
      { id: 'nidam',      img: '../../images/players/13-nidam.webp',       name: 'נדב נידם',        num: 13 },
      { id: 'talpa',      img: '../../images/players/21-talpa.webp',       name: 'אלכס טלפה',       num: 21 },
      { id: 'zarura',     img: '../../images/players/16-zarura.webp',      name: 'בסאם זרוראע',     num: 16 },
      { id: 'haziza',     img: '../../images/players/8-haziza.webp',       name: 'דולב חזיזה',      num: 8 },
      { id: 'ciprian',    img: '../../images/players/25-cifrian.webp',     name: 'ויליאם סיפריאן',  num: 25 },
      { id: 'aziz',       img: '../../images/players/aziz.webp',           name: 'עזיז אבוטארה',    num: 32 },
      { id: 'shamir',     img: '../../images/players/18-shamir.webp',      name: 'עמרי שמיר',       num: 18 },
      { id: 'maor',       img: '../../images/players/15-maor.webp',        name: 'מאור לוי',        num: 15 },
      { id: 'oz',         img: '../../images/players/10-oz.webp',          name: 'עוז בילו',        num: 10 },
      { id: 'yarin',      img: '../../images/players/17-yarin.webp',       name: 'ירין אבוחצירא',   num: 17 },
      { id: 'hugi',       img: '../../images/players/11-hugi.webp',        name: 'דור חוגי',        num: 11 },
      { id: 'liam',       img: '../../images/players/14-liem.webp',        name: 'ליאם כהן',        num: 23 },
      { id: 'davo',       img: '../../images/players/83-davo.webp',        name: 'מתאוס דאבו',      num: 83 },
    ];

    const LEVELS = {
      easy:   { label: 'קל',     pairs: 6 },
      medium: { label: 'בינוני', pairs: 9 },
      hard:   { label: 'קשה',    pairs: 12 },
      expert: { label: 'מומחה',  pairs: 16 },
    };

    let flipped = [], matched = 0, attempts = 0, locked = false, currentLevel = 'easy', totalPairs = 6;

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function showLevelSelect() {
      document.getElementById('win-msg').classList.remove('show');
      document.getElementById('level-select').style.display = 'grid';
      document.body.classList.remove('playing');
      document.getElementById('game-area').style.display = 'none';
    }

    function startGame(level) {
      currentLevel = level;
      const cfg = LEVELS[level];
      totalPairs = cfg.pairs;

      document.getElementById('level-select').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      document.body.classList.add('playing');
      document.getElementById('level-label').textContent = cfg.label;
      document.getElementById('total-pairs').textContent = totalPairs;

      flipped = []; matched = 0; attempts = 0; locked = false;
      document.getElementById('attempts').textContent = 0;
      document.getElementById('matched').textContent = 0;
      document.getElementById('win-msg').classList.remove('show');

      const chosen = shuffle(roster).slice(0, totalPairs);
      const cards = shuffle([...chosen, ...chosen].map((p, i) => ({ ...p, uid: i })));

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards.forEach(card => {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.id = card.id;
        el.innerHTML = `
          <div class="card-face card-back">⚽</div>
          <div class="card-face card-front">
            <img src="${card.img}" alt="${card.name}">
            <div class="pup-name">${card.name} #${card.num}</div>
          </div>`;
        el.addEventListener('click', () => flipCard(el));
        grid.appendChild(el);
      });
      fitGrid();
      window.scrollTo(0, 0);
    }

    // Pick the column count that gives the biggest cards while the whole board
    // fits on screen, in portrait or landscape. If even the best fit would make
    // cards too small to tap, keep them tappable and let the board scroll.
    const GAP = 8, MIN_CARD = 64, MAX_CARD = 120, CARD_RATIO = 0.75;
    function fitGrid() {
      const grid = document.getElementById('grid');
      const n = grid.children.length;
      if (!n || document.getElementById('game-area').style.display === 'none') return;
      const width = grid.parentElement.clientWidth;
      const top = grid.getBoundingClientRect().top + window.scrollY;
      // Room under the board for the restart buttons and bottom padding.
      const height = window.innerHeight - top - (window.innerHeight < 500 ? 72 : 120);
      let best = { cols: 4, card: 0 };
      for (let cols = 2; cols <= n; cols++) {
        const rows = Math.ceil(n / cols);
        const byWidth = (width - GAP * (cols - 1)) / cols;
        const byHeight = ((height - GAP * (rows - 1)) / rows) * CARD_RATIO;
        const card = Math.min(byWidth, byHeight, MAX_CARD);
        if (card > best.card) best = { cols, card };
      }
      if (best.card < MIN_CARD) {
        const cols = Math.min(n, Math.max(2, Math.floor((width + GAP) / (MIN_CARD + GAP))));
        best = { cols, card: Math.min((width - GAP * (cols - 1)) / cols, MAX_CARD) };
      }
      grid.style.gridTemplateColumns = `repeat(${best.cols}, 1fr)`;
      grid.style.maxWidth = Math.floor(best.card * best.cols + GAP * (best.cols - 1)) + 'px';
    }
    window.addEventListener('resize', fitGrid);
    window.addEventListener('orientationchange', fitGrid);

    function flipCard(el) {
      if (locked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      el.classList.add('flipped');
      haptic(10);
      flipped.push(el);
      if (flipped.length === 2) {
        locked = true;
        attempts++;
        document.getElementById('attempts').textContent = attempts;
        setTimeout(checkMatch, 900);
      }
    }

    function checkMatch() {
      const [a, b] = flipped;
      if (a.dataset.id === b.dataset.id) {
        a.classList.add('matched'); b.classList.add('matched');
        matched++;
        document.getElementById('matched').textContent = matched;
        if (matched === totalPairs) {
          document.getElementById('win-msg').classList.add('show');
          haptic([40, 60, 40, 60, 120]);
          addStar();
        } else {
          haptic(35);
        }
      } else {
        a.classList.remove('flipped'); b.classList.remove('flipped');
        a.classList.add('shake'); b.classList.add('shake');
        setTimeout(() => { a.classList.remove('shake'); b.classList.remove('shake'); }, 400);
      }
      flipped = []; locked = false;
    }

    function addStar() {
      localStorage.setItem('maccabi-netanya-stars', parseInt(localStorage.getItem('maccabi-netanya-stars') || '0') + 1);
    }
  </script>
</body>
</html>
