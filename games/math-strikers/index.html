<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#001a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מכבי נתניה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Math Strikers — מכבי נתניה</title>
  <link rel="stylesheet" href="../../fonts/fredoka.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 50%, #003087 100%);
      color: #fff;
      direction: rtl;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* The match fills the viewport edge to edge; the only chrome is a back
       button and a sound button floating just above the right end of the
       game's score bar. placeCorner() below keeps them lined up with it. */
    .corner {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #shell {
      position: fixed;
      inset: 0;
      background: #001a3d;
    }

    /* Both corner buttons are round chunky icons, like the rest of the site. */
    .back, .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 3px solid #163679;
      background: linear-gradient(180deg, #4d8dff, #2556c8);
      box-shadow: 0 4px 0 #163679, inset 0 2px 0 rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 21px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }
    .back:active, .sound-toggle:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #163679, inset 0 2px 0 rgba(255, 255, 255, 0.4);
    }
    svg.icon {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #stage {
      position: absolute;
      inset: 0;
    }

    /* The game stays inside the safe area: clear of the status bar and notch
       above and the home indicator below. The bands outside it show the
       shell's navy, like the bars around a native app. */
    #frame {
      position: absolute;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1f16;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(77, 141, 255, 0.35), transparent 60%),
        linear-gradient(180deg, #0d2350 0%, #0a1a36 75%);
      text-align: center;
      padding: 24px;
    }

    /* A ball bouncing on its shadow while the game loads. */
    .loader-ball { position: relative; width: 84px; height: 120px; }
    .loader-ball svg {
      position: absolute; left: 12px; top: 0; width: 60px; height: 60px;
      animation: ball-bounce 0.9s cubic-bezier(.5, 0, .5, 1) infinite alternate;
    }
    .loader-ball::after {
      content: ""; position: absolute; left: 17px; bottom: 4px; width: 50px; height: 10px;
      border-radius: 50%; background: rgba(0, 0, 0, 0.45);
      animation: shadow-pulse 0.9s cubic-bezier(.5, 0, .5, 1) infinite alternate;
    }
    @keyframes ball-bounce { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(52px) rotate(200deg); } }
    @keyframes shadow-pulse { from { transform: scale(0.55); opacity: 0.5; } to { transform: scale(1); opacity: 1; } }

    #loading h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #ffd23f;
      text-shadow: -2px -2px 0 #8a5a00, 2px -2px 0 #8a5a00, -2px 2px 0 #8a5a00, 2px 2px 0 #8a5a00, 0 4px 0 #8a5a00;
    }
    #loading .tip {
      max-width: 22em;
      min-height: 2.6em;
      color: #fff6dd;
      font-size: 1rem;
      line-height: 1.3;
      transition: opacity 0.3s;
    }

    #bar-track {
      position: relative;
      width: min(300px, 72vw);
      height: 22px;
      border-radius: 999px;
      background: #10264d;
      border: 3px solid #ffd23f;
      box-shadow: 0 4px 0 #8a5a00;
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(-45deg, #ffd23f 0 12px, #f2a900 12px 24px);
      transition: width 0.15s linear;
    }

    #bar-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #0a1a36;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: rgba(0, 12, 28, 0.95);
      text-align: center;
    }
    #error p { color: #ffd6d2; max-width: 34em; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="shell">
    <div class="corner">
      <a class="back" href="../../index.html" aria-label="חזרה למשחקים"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
      <button class="sound-toggle" id="sound-toggle" type="button"></button>
    </div>

    <div id="stage">
      <div id="frame">
        <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

        <div id="loading">
          <div class="loader-ball" aria-hidden="true">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#fff" stroke="#0a1a36" stroke-width="4"/><path d="M32 18l12 9-5 14H25l-5-14z" fill="#0a1a36"/><path d="M32 18V5M44 27l12-5M39 41l8 11M25 41l-8 11M20 27L8 22" stroke="#0a1a36" stroke-width="4"/></svg>
          </div>
          <h2>טוען את המשחק</h2>
          <div id="bar-track"><div id="bar-fill"></div><div id="bar-pct">0%</div></div>
          <p class="tip" id="tip"></p>
        </div>

        <div id="error">
          <h2>המשחק לא נטען</h2>
          <p id="error-text"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../../app.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var frame = document.querySelector("#frame");
    var stage = document.querySelector("#stage");
    var loading = document.querySelector("#loading");
    var barFill = document.querySelector("#bar-fill");
    var errorBox = document.querySelector("#error");
    var errorText = document.querySelector("#error-text");
    frame.appendChild(document.querySelector(".corner"));
    var game = null;

    // Tips that rotate on the loading screen.
    var tips = [
      "מכבי נתניה נוסדה ב־1934, והצבעים שלה הם צהוב ושחור.",
      "הקשב לקהל: כשמבקיעים, כל האצטדיון מריע!",
      "אפשר להשתיק את הצלילים בכפתור הרמקול.",
      "כל ניצחון מוסיף כוכבים לאוסף שלך בעמוד הראשי.",
      "טיפ: בהתחלה קל יותר. כשמשתפרים, עולים רמה!"
    ];
    var tipEl = document.getElementById("tip");
    var tipIndex = Math.floor(Math.random() * tips.length);
    function nextTip() {
      tipEl.style.opacity = 0;
      setTimeout(function () { tipEl.textContent = tips[tipIndex++ % tips.length]; tipEl.style.opacity = 1; }, 250);
    }
    tipEl.textContent = tips[tipIndex++ % tips.length];
    var tipTimer = setInterval(nextTip, 3200);
    var barPct = document.getElementById("bar-pct");


    // The page's sound button mutes the game too; the choice is shared with the
    // other games and remembered.
    function sendMute() {
      if (game) game.SendMessage("MatchAudio", "SetMuted", sfx.isMuted() ? "1" : "0");
    }
    sfx.bindToggle(document.getElementById("sound-toggle"), { clips: false, onChange: sendMute });

    // Match the drawing buffer to the viewport (capped by device pixel ratio so a
    // phone is not asked to render four times the pixels it can show), and let the
    // game camera widen instead of letterboxing.
    // Installed on an iPhone (standalone, black-translucent status bar) the page
    // is drawn from the very top of the screen, but iOS reports a viewport that
    // is short by the status bar - so a full-height layout stops early and
    // leaves a white band at the bottom. There, size the shell to the real
    // screen. The frame inside it keeps clear of the status bar and the home
    // indicator via the safe-area insets, and everything sizes from the frame.
    var shell = document.querySelector("#shell");
    var installedOnIOS = window.navigator.standalone === true;
    function sizeShell() {
      if (!installedOnIOS) return;
      var portrait = window.matchMedia("(orientation: portrait)").matches;
      var longSide = Math.max(screen.width, screen.height);
      var shortSide = Math.min(screen.width, screen.height);
      shell.style.bottom = "auto";
      shell.style.height = (portrait ? longSide : shortSide) + "px";
    }

    function fit() {
      sizeShell();
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = "";
      canvas.style.height = "";
      canvas.width = Math.floor(frame.clientWidth * ratio);
      canvas.height = Math.floor(frame.clientHeight * ratio);
    }

    // iOS settles its viewport a moment after a rotation or a cold start.
    function refit() { fit(); setTimeout(fit, 300); }
    window.addEventListener("resize", refit);
    window.addEventListener("orientationchange", refit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);
    window.addEventListener("load", refit);
    fit();

    // The game's HUD is laid out on a 1920x1080 canvas scaled by the geometric
    // mean of the two ratios (CanvasScaler, match 0.5). Its score bar runs along
    // the bottom 30 units in, 110 tall, with a 40 unit side margin; sit the
    // buttons 16 units above it, flush with its right edge.
    var corner = document.querySelector(".corner");
    function placeCorner() {
      var scale = Math.sqrt((frame.clientWidth / 1920) * (frame.clientHeight / 1080));
      corner.style.bottom = Math.round((30 + 110 + 16) * scale) + "px";
      corner.style.right = Math.round(40 * scale) + "px";
    }
    window.addEventListener("resize", function () { placeCorner(); setTimeout(placeCorner, 300); });
    window.addEventListener("orientationchange", function () { setTimeout(placeCorner, 300); });
    placeCorner();

    function showError(message) {
      loading.style.display = "none";
      errorBox.style.display = "flex";
      errorText.textContent = message;
    }

    var config = {
      dataUrl: "Build/math-strikers.data",
      frameworkUrl: "Build/math-strikers.framework.js",
      codeUrl: "Build/math-strikers.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Maccabi Netanya Games",
      productName: "Math Strikers",
      productVersion: "1.0",
      // Same cap as fit(): without it Unity sizes the drawing buffer from the raw
      // devicePixelRatio and renders at 3x on recent iPhones.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (message, type) {
        if (type === "error") showError(message);
      }
    };

    var script = document.createElement("script");
    script.src = "Build/math-strikers.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
        barPct.textContent = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        game = instance;
        sendMute();
        loading.style.display = "none";
        clearInterval(tipTimer);
        fit();
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    };
    script.onerror = function () {
      showError("קובץ המשחק לא נמצא. נסו לרענן את הדף.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
