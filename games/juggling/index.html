<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#001a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מכבי נתניה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Juggling — מכבי נתניה</title>
  <link rel="stylesheet" href="../../fonts/fredoka.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 50%, #003087 100%);
      color: #fff;
      direction: rtl;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* The game fills the viewport edge to edge; the only chrome is a back
       button and a sound button sitting in the strip of grass below the ball's
       play area, where nothing ever needs tapping. placeCorner() below keeps
       them centred in that strip. */
    .corner {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #shell {
      position: fixed;
      inset: 0;
      background: #001a3d;
    }

    /* Both corner buttons are round symbols, no words, so they stay small. */
    .back, .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 204, 0, 0.55);
      background: rgba(255, 255, 255, 0.10);
      color: #ffe680;
      font-weight: bold;
      font-size: 1.3rem;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .sound-toggle { font-size: 1.15rem; }
    .back:hover, .back:active,
    .sound-toggle:hover, .sound-toggle:active { background: rgba(255, 204, 0, 0.22); }

    #stage {
      position: absolute;
      inset: 0;
    }

    /* The game stays inside the safe area: clear of the status bar and notch
       above and the home indicator below. The bands outside it show the
       shell's navy, like the bars around a native app. */
    #frame {
      position: absolute;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1f16;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 100%);
      text-align: center;
      padding: 20px;
    }

    #loading h2 { font-size: 1.5rem; color: #ffcc00; }
    #loading p { color: #cfe0ff; font-size: 0.95rem; }

    #bar-track {
      width: min(320px, 70vw);
      height: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: #ffcc00;
      transition: width 0.15s linear;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: rgba(0, 12, 28, 0.95);
      text-align: center;
    }
    #error p { color: #ffd6d2; max-width: 34em; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="shell">
    <div class="corner">
      <a class="back" href="../../index.html" aria-label="חזרה למשחקים">←</a>
      <button class="sound-toggle" id="sound-toggle" type="button"></button>
    </div>

    <div id="stage">
      <div id="frame">
        <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

        <div id="loading">
          <h2>טוען את המשחק…</h2>
          <div id="bar-track"><div id="bar-fill"></div></div>
          <p>הפעם הראשונה עשויה לקחת קצת יותר זמן</p>
        </div>

        <div id="error">
          <h2>המשחק לא נטען</h2>
          <p id="error-text"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../../app.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var frame = document.querySelector("#frame");
    var stage = document.querySelector("#stage");
    var loading = document.querySelector("#loading");
    var barFill = document.querySelector("#bar-fill");
    var errorBox = document.querySelector("#error");
    var errorText = document.querySelector("#error-text");
    frame.appendChild(document.querySelector(".corner"));
    var game = null;

    // The page's sound button mutes the game too; the choice is shared with the
    // other games and remembered.
    function sendMute() {
      if (game) game.SendMessage("JuggleAudio", "SetMuted", sfx.isMuted() ? "1" : "0");
    }
    sfx.bindToggle(document.getElementById("sound-toggle"), { clips: false, onChange: sendMute });

    // Match the drawing buffer to the viewport (capped by device pixel ratio so a
    // phone is not asked to render four times the pixels it can show), and let the
    // game camera widen instead of letterboxing.
    // Installed on an iPhone (standalone, black-translucent status bar) the page
    // is drawn from the very top of the screen, but iOS reports a viewport that
    // is short by the status bar - so a full-height layout stops early and
    // leaves a white band at the bottom. There, size the shell to the real
    // screen. The frame inside it keeps clear of the status bar and the home
    // indicator via the safe-area insets, and everything sizes from the frame.
    var shell = document.querySelector("#shell");
    var installedOnIOS = window.navigator.standalone === true;
    function sizeShell() {
      if (!installedOnIOS) return;
      var portrait = window.matchMedia("(orientation: portrait)").matches;
      var longSide = Math.max(screen.width, screen.height);
      var shortSide = Math.min(screen.width, screen.height);
      shell.style.bottom = "auto";
      shell.style.height = (portrait ? longSide : shortSide) + "px";
    }

    function fit() {
      sizeShell();
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = "";
      canvas.style.height = "";
      canvas.width = Math.floor(frame.clientWidth * ratio);
      canvas.height = Math.floor(frame.clientHeight * ratio);
    }

    // iOS settles its viewport a moment after a rotation or a cold start.
    function refit() { fit(); setTimeout(fit, 300); }
    window.addEventListener("resize", refit);
    window.addEventListener("orientationchange", refit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);
    window.addEventListener("load", refit);
    fit();

    // The game camera puts the grass line 16% of the way up the screen
    // (CameraFramer.GroundFraction) and the ball never goes below it, so the
    // strip under it is free: centre the 40px buttons in it, clear of the
    // phone's home indicator.
    var corner = document.querySelector(".corner");
    function placeCorner() {
      var strip = frame.clientHeight * 0.16;
      var bottom = Math.max(8, Math.round((strip - 40) / 2));
      corner.style.bottom = bottom + "px";
      corner.style.right = "14px";
    }
    window.addEventListener("resize", function () { placeCorner(); setTimeout(placeCorner, 300); });
    window.addEventListener("orientationchange", function () { setTimeout(placeCorner, 300); });
    placeCorner();

    function showError(message) {
      loading.style.display = "none";
      errorBox.style.display = "flex";
      errorText.textContent = message;
    }

    var config = {
      dataUrl: "Build/juggling.data",
      frameworkUrl: "Build/juggling.framework.js",
      codeUrl: "Build/juggling.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Maccabi Netanya Games",
      productName: "Juggling",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (message, type) {
        if (type === "error") showError(message);
      }
    };

    var script = document.createElement("script");
    script.src = "Build/juggling.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        game = instance;
        sendMute();
        loading.style.display = "none";
        fit();
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    };
    script.onerror = function () {
      showError("קובץ המשחק לא נמצא. נסו לרענן את הדף.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
