<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#001a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מכבי נתניה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>{{{ PRODUCT_NAME }}} — מכבי נתניה</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 50%, #003087 100%);
      color: #fff;
      direction: rtl;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* The match fills the viewport edge to edge; the only chrome is a back
       button and a sound button floating just above the right end of the
       game's score bar. placeCorner() below keeps them lined up with it. */
    .corner {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #shell {
      position: fixed;
      inset: 0;
    }

    /* Both corner buttons are round symbols, no words, so they stay small. */
    .back, .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 204, 0, 0.55);
      background: rgba(255, 255, 255, 0.10);
      color: #ffe680;
      font-weight: bold;
      font-size: 1.3rem;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .sound-toggle { font-size: 1.15rem; }
    .back:hover, .back:active,
    .sound-toggle:hover, .sound-toggle:active { background: rgba(255, 204, 0, 0.22); }

    #stage {
      position: absolute;
      inset: 0;
    }

    #frame {
      position: absolute;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1f16;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 100%);
      text-align: center;
      padding: 20px;
    }

    #loading h2 { font-size: 1.5rem; color: #ffcc00; }
    #loading p { color: #cfe0ff; font-size: 0.95rem; }

    #bar-track {
      width: min(320px, 70vw);
      height: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: #ffcc00;
      transition: width 0.15s linear;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: rgba(0, 12, 28, 0.95);
      text-align: center;
    }
    #error p { color: #ffd6d2; max-width: 34em; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="shell">
    <div class="corner">
      <a class="back" href="../../index.html" aria-label="חזרה למשחקים">←</a>
      <button class="sound-toggle" id="sound-toggle" type="button"></button>
    </div>

    <div id="stage">
      <div id="frame">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

        <div id="loading">
          <h2>טוען את המשחק…</h2>
          <div id="bar-track"><div id="bar-fill"></div></div>
          <p>הפעם הראשונה עשויה לקחת קצת יותר זמן</p>
        </div>

        <div id="error">
          <h2>המשחק לא נטען</h2>
          <p id="error-text"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../../app.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var frame = document.querySelector("#frame");
    var stage = document.querySelector("#stage");
    var loading = document.querySelector("#loading");
    var barFill = document.querySelector("#bar-fill");
    var errorBox = document.querySelector("#error");
    var errorText = document.querySelector("#error-text");
    var game = null;

    // The page's sound button mutes the game too; the choice is shared with the
    // other games and remembered.
    function sendMute() {
      if (game) game.SendMessage("MatchAudio", "SetMuted", sfx.isMuted() ? "1" : "0");
    }
    sfx.bindToggle(document.getElementById("sound-toggle"), { clips: false, onChange: sendMute });

    // Match the drawing buffer to the viewport (capped by device pixel ratio so a
    // phone is not asked to render four times the pixels it can show), and let the
    // game camera widen instead of letterboxing.
    function fit() {
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    fit();

    // The game's HUD is laid out on a 1920x1080 canvas scaled by the geometric
    // mean of the two ratios (CanvasScaler, match 0.5). Its score bar runs along
    // the bottom 30 units in, 110 tall, with a 40 unit side margin; sit the
    // buttons 16 units above it, flush with its right edge.
    var corner = document.querySelector(".corner");
    function placeCorner() {
      var scale = Math.sqrt((window.innerWidth / 1920) * (window.innerHeight / 1080));
      corner.style.bottom = Math.round((30 + 110 + 16) * scale) + "px";
      corner.style.right = Math.round(40 * scale) + "px";
    }
    window.addEventListener("resize", placeCorner);
    placeCorner();

    function showError(message) {
      loading.style.display = "none";
      errorBox.style.display = "flex";
      errorText.textContent = message;
    }

    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (message, type) {
        if (type === "error") showError(message);
      }
    };

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        game = instance;
        sendMute();
        loading.style.display = "none";
        fit();
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    };
    script.onerror = function () {
      showError("קובץ המשחק לא נמצא. נסו לרענן את הדף.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
