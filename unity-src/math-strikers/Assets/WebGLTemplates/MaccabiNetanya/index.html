<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}} — מכבי נתניה</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 50%, #003087 100%);
      color: #fff;
      direction: rtl;
    }

    #shell {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.28);
      border-bottom: 2px solid rgba(255, 204, 0, 0.45);
    }

    header h1 {
      font-size: 1.15rem;
      color: #ffcc00;
      text-shadow: 2px 2px 0 #b38f00;
      white-space: nowrap;
    }

    .back {
      flex: 0 0 auto;
      display: inline-block;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 204, 0, 0.55);
      background: rgba(255, 255, 255, 0.10);
      color: #ffe680;
      font-weight: bold;
      font-size: 0.95rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .back:hover { background: rgba(255, 204, 0, 0.22); }

    /* The stage keeps the match at 16:9 and as large as the window allows,
       so the game fills a phone screen and a desktop window equally well. */
    #stage {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 8px;
    }

    #frame {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1f16;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #001a3d 0%, #002b5c 100%);
      text-align: center;
      padding: 20px;
    }

    #loading h2 { font-size: 1.5rem; color: #ffcc00; }
    #loading p { color: #cfe0ff; font-size: 0.95rem; }

    #bar-track {
      width: min(320px, 70vw);
      height: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: #ffcc00;
      transition: width 0.15s linear;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: rgba(0, 12, 28, 0.95);
      text-align: center;
    }
    #error p { color: #ffd6d2; max-width: 34em; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="shell">
    <header>
      <h1>⚽ בועטים וחושבים</h1>
      <a class="back" href="../../index.html">← חזרה למשחקים</a>
    </header>

    <div id="stage">
      <div id="frame">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

        <div id="loading">
          <h2>טוען את המשחק…</h2>
          <div id="bar-track"><div id="bar-fill"></div></div>
          <p>הפעם הראשונה עשויה לקחת קצת יותר זמן</p>
        </div>

        <div id="error">
          <h2>המשחק לא נטען</h2>
          <p id="error-text"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var frame = document.querySelector("#frame");
    var stage = document.querySelector("#stage");
    var loading = document.querySelector("#loading");
    var barFill = document.querySelector("#bar-fill");
    var errorBox = document.querySelector("#error");
    var errorText = document.querySelector("#error-text");

    var ASPECT = {{{ WIDTH }}} / {{{ HEIGHT }}};

    // Fit the largest 16:9 box that still fits the stage, so the match scales
    // from a phone in portrait up to a full desktop window without cropping.
    function fit() {
      var available = stage.getBoundingClientRect();
      var width = Math.max(0, available.width - 16);
      var height = Math.max(0, available.height - 16);
      if (width / height > ASPECT) width = height * ASPECT;
      else height = width / ASPECT;
      frame.style.width = Math.floor(width) + "px";
      frame.style.height = Math.floor(height) + "px";
    }

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    fit();

    function showError(message) {
      loading.style.display = "none";
      errorBox.style.display = "flex";
      errorText.textContent = message;
    }

    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (message, type) {
        if (type === "error") showError(message);
      }
    };

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
        fit();
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    };
    script.onerror = function () {
      showError("קובץ המשחק לא נמצא. נסו לרענן את הדף.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
