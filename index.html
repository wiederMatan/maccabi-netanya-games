<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מכבי נתניה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>משחקי מכבי נתניה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="portal">
    <header>
      <h1>⚽ משחקי מכבי נתניה</h1>
      <p class="subtitle">למד להכיר את השחקנים ושחק!</p>
      <div class="stars-display">⭐ <span id="total-stars">0</span> כוכבים</div>
    </header>

    <div class="games-grid">
      <a href="games/memory/index.html" class="game-card">
        <div class="game-icon">🃏</div>
        <div class="game-title">משחק זיכרון</div>
        <div class="game-desc">מצא את זוגות השחקנים!</div>
        <div class="pups">4 רמות קושי</div>
      </a>

      <a href="games/math-strikers/index.html" class="game-card">
        <div class="game-icon">⚽</div>
        <div class="game-title">בועטים וחושבים</div>
        <div class="game-desc">פתור תרגיל ובעט לשער!</div>
        <div class="pups">4 רמות קושי</div>
      </a>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="portal.js"></script>

</html>
